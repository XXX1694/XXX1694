name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light&color_snake=#02569B&color_dots=#ebedf0,#b3e0ff,#5cc4ff,#13B9FD,#02569B
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#13B9FD&color_dots=#161b22,#0b3a5c,#0a6aa8,#0f95d6,#13B9FD

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
